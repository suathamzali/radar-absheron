<html lang="en">
<head>

<link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #e9ece7; --paper: #ffffff; --ink: #15212b; --ink-2: #44515c; --line: #cfd5d2;
  --accent: #0b5f66; --soft: #eef6f5; --hh: #a3237a; --hv: #1d7a3c; --warn: #8a4b00;
  --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font); }
:focus-visible { outline: 3px solid #c25700; outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: rgba(255,255,255,.95); border-top: 1px solid var(--line); }
.bar button, .bar a { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--ink);
  background: #fff; font: 500 15px var(--font); color: var(--ink); cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; }
.bar button[disabled] { opacity: .4; cursor: default; }
.bar .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.bar .count { font: 500 15px var(--mono); margin: 0 auto; }
.bar .lang { display: flex; gap: 4px; }
.bar .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.deck { position: fixed; inset: 0 0 61px 0; overflow: hidden; }
.slide { width: 1280px; height: 720px; background: var(--paper); position: absolute; left: 50%; top: 50%;
  transform-origin: center center; padding: 52px 64px 40px; display: none; flex-direction: column;
  box-shadow: 0 10px 40px rgba(0,0,0,.18); overflow: hidden; }
.slide.on { display: flex; }
.kicker { font: 500 15px/1.2 var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }
.slide h1 { font-size: 64px; line-height: 1.02; margin: 0 0 16px; letter-spacing: -.01em; }
.slide h2 { font-size: 36px; line-height: 1.14; margin: 0 0 22px; letter-spacing: -.005em; }
.slide p, .slide li { font-size: 21px; line-height: 1.42; margin: 0 0 12px; }
.slide ul, .slide ol { margin: 0; padding-left: 1.1em; }
.slide li { margin-bottom: 10px; }
.slide .small { font-size: 16px; color: var(--ink-2); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; flex: 1; min-height: 0; align-items: center; }
.cols-img { grid-template-columns: .8fr 1.2fr; }
.cols-60 { grid-template-columns: 1.15fr .85fr; }
.foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 24px;
  font: 400 13px/1.4 var(--mono); color: var(--ink-2); }
.crit { align-self: flex-start; font: 600 14px/1 var(--mono); color: #fff; background: var(--accent); padding: 7px 11px;
  border-radius: 999px; margin-bottom: 14px; letter-spacing: .03em; }
figure { margin: 0; }
figure img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); }
figcaption { font-size: 15px; color: var(--ink-2); margin-top: 6px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big { font: 600 50px/1 var(--font); color: var(--accent); }
.big small { font-size: 22px; color: var(--ink-2); font-weight: 500; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--soft); }
.stat p { font-size: 18px; margin: 6px 0 0; }
.stats { display: grid; gap: 12px; align-content: start; }
.pipe { font: 400 15.5px/1.55 var(--mono); background: #f3f5f2; border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; white-space: pre-wrap; margin: 0; align-self: start; }
table.users { border-collapse: collapse; width: 100%; font-size: 18px; align-self: start; }
table.users th, table.users td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.users th { font: 600 14px var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
table.users td:first-child { font-weight: 600; width: 34%; }
.steps { counter-reset: s; list-style: none; padding: 0 !important; }
.steps li { counter-increment: s; position: relative; padding-left: 44px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent); color: #fff; display: grid; place-items: center; font: 600 16px var(--mono); }
.title-slide { background: linear-gradient(135deg, #0b5f66 0%, #15212b 100%); color: #fff; }
.title-slide .kicker { color: #9fe0d6; }
.title-slide p { color: #e3ecea; }
.title-slide .foot { border-color: rgba(255,255,255,.25); color: #cfe2df; }
.qr { width: 200px; height: 200px; background: #fff; border-radius: 12px; padding: 10px; }
.qr img { width: 100%; height: 100%; display: block; }
.url { font: 500 19px var(--mono); color: #fff; text-align: center; }

body.shot { background: #fff; overflow: hidden; }
body.shot .bar, body.shot #live { display: none; }
body.shot .deck { inset: 0; }
body.shot .slide { left: 0; top: 0; transform: none !important; box-shadow: none; }

.frame { display: contents; }
@media (max-width: 760px) {
  html, body { overflow-x: hidden; }
  .deck { position: static; overflow: visible; padding: 10px 0 80px; }
  .frame { display: block; position: relative; overflow: hidden; margin: 0 8px 12px; border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .frame .slide { display: flex; position: absolute; left: 0; top: 0; transform-origin: top left; box-shadow: none; }
  .bar .count, #prev, #next { display: none; }
}

@page { size: 1280px 720px; margin: 0; }
@media print {
  html, body { height: auto; background: #fff; }
  .bar { display: none; }
  .deck { position: static; overflow: visible; }
  .slide { display: grid !important; grid-template-rows: auto auto auto 1fr auto; align-content: start;
    position: relative; left: 0; top: 0; transform: none !important; margin: 0 !important;
    box-shadow: none; break-inside: avoid; height: 718px !important; max-height: 718px; }
  .slide + .slide { break-before: page; page-break-before: always; }
  .slide .foot { align-self: end; }
  .title-slide { grid-template-rows: auto 1fr auto; }
  #live { display: none; }
  .slide, .stat, .crit, .steps li::before, .pipe, .qr { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>

  T(`<span class="crit">Relevance of the problem</span>

<figcaption>Same area, 12 July 2026 (48.3–49.4° E, 39.4–40.1° N). Left: NASA MODIS, partly cloudy. Right: NISAR radar, the Kura river and fields.</figcaption></figure></div>

<div class="cols cols-img"><ul>

<li>Optik peyklərə günəş işığı və açıq səma lazımdır. 12 iyul 2026-da bu ərazinin təxminən yarısını buludlar örtmüşdü.</li>
<li>Radar buludların arxasını görür, amma onun məlumatı (σ⁰, dB, HH/HV) mütəxəssis olmayan üçün anlaşılmazdır və Azərbaycan dilində izah edən heç nə yoxdur.</li></ul>
<figure><div class="pair"><img src="img/optical-0712.jpg" alt="12 iyul 2026-da Kür ovalığının MODIS şəkli, çox hissəsi bulud altında"><img src="img/radar-0712.jpg" alt="Həmin səhər eyni ərazinin NISAR radar şəkli, Kür çayı və sahələr görünür"></div>

<h2>A story map anyone can read, on a phone, in Azerbaijani or English</h2>
<div class="cols cols-60"><figure><img src="img/app-clouds.jpg" alt="Screenshot of the Radar Absheron app: story panel on the left, swipe map on the right"><figcaption>Live app: ${LIVE}</figcaption></figure>

<div class="foot"><span>Demo: the live app and this deck</span><span>3 / 7</span></div>`,

<div class="foot"><span>NISAR SME2 PROVISIONAL (not yet validated) · NASA POWER reanalysis</span><span>4 / 7</span></div>`,

<h2>Torpaq 3 oktyabr yağışını hiss etdi</h2>
<div class="cols cols-60"><figure><div class="pair"><img src="img/sm-before.jpg" alt="22 sentyabr 2026, NISAR torpaq nəmliyi xəritəsi, əsasən qəhvəyi, quru"><img src="img/sm-after.jpg" alt="4 oktyabr 2026, NISAR torpaq nəmliyi xəritəsi, əsasən göy, daha nəm"></div>

<div class="stat"><div class="big">+0,6–1,3 <small>dB</small></div><p>Quru əks-sədası sabit nəzarətlərdən (şəhər, neft yataqları, dəniz) bu qədər çox artdı.</p></div>

  T(`<span class="crit">Innovation</span>
<h2>Radar made readable, without losing the science</h2>
<div class="cols"><ul>

  T(`<span class="crit">Market potential · scalability</span>
<h2>Free for users, near-zero cost to run, ready for any NISAR frame</h2>
<div class="cols"><table class="users"><thead><tr><th>Who</th><th>What they get</th></tr></thead><tbody>

const params = new URLSearchParams(location.search);
let lang = params.get('lang') === 'az' ? 'az' : 'en';
let cur = Math.max(0, Math.min(SLIDES.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
const deck = document.getElementById('deck');
const SHOT = params.has('shot');
if (SHOT) { document.body.classList.add('shot'); cur = Math.max(0, Math.min(SLIDES.length - 1, parseInt(params.get('shot'), 10) - 1 || 0)); }
const UI = {
  en: { prev: 'Previous slide', next: 'Next slide', app: 'App', slide: (i, n) => `Slide ${i} of ${n}` },
  az: { prev: 'Əvvəlki slayd', next: 'Növbəti slayd', app: 'Tətbiq', slide: (i, n) => `Slayd ${i} / ${n}` },
};

function render() {
  document.documentElement.lang = lang;
  deck.innerHTML = SLIDES.map((s, i) => `<div class="frame"><section class="slide ${s.cls || ''}" role="group" aria-roledescription="slide" aria-label="${UI[lang].slide(i + 1, SLIDES.length)}">${s[lang]}</section></div>`).join('');
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.getElementById('prev').setAttribute('aria-label', UI[lang].prev);
  document.getElementById('next').setAttribute('aria-label', UI[lang].next);
  document.getElementById('appLink').textContent = UI[lang].app;
  document.getElementById('pdf').href = `radar-absheron-pitch-${lang}.pdf`;
  show(cur, false);
}
function show(i, announce = true) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  document.querySelectorAll('.slide').forEach((s, k) => s.classList.toggle('on', k === cur));
  document.getElementById('count').textContent = `${cur + 1} / ${SLIDES.length}`;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === SLIDES.length - 1;
  if (!SHOT) history.replaceState(null, '', `${location.pathname}${lang === 'az' ? '?lang=az' : ''}#${cur + 1}`);
  fit();
  if (announce) {
    const h = document.querySelectorAll('.slide')[cur].querySelector('h1, h2');
    document.getElementById('live').textContent = `${UI[lang].slide(cur + 1, SLIDES.length)}: ${h ? h.textContent : ''}`;
  }
}
function fit() {
  if (SHOT) return;
  const narrow = window.matchMedia('(max-width: 760px)').matches;
  document.querySelectorAll('.slide').forEach((s) => {
    if (narrow) {
      const fw = document.documentElement.clientWidth - 16;
      const k = fw / 1280;
      s.parentElement.style.height = `${Math.round(720 * k)}px`;
      s.style.transform = `scale(${k})`;
      s.style.margin = '';
    } else {
      s.parentElement.style.height = '';
      const k = Math.min(deck.clientWidth / 1320, deck.clientHeight / 760);
      s.style.transform = `translate(-50%, -50%) scale(${k})`;
      s.style.margin = '';
    }
  });
}
document.getElementById('prev').addEventListener('click', () => show(cur - 1));
document.getElementById('next').addEventListener('click', () => show(cur + 1));
document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; render(); }));
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (['ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && e.target.tagName !== 'BUTTON')) { e.preventDefault(); show(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(SLIDES.length - 1);
});
window.addEventListener('resize', fit);
render();
</script>
